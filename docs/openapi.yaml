openapi: 3.0.3

info:
  title: Waffir API
  version: "1.0.0"
  description: |
    REST API for the Waffir price-tracking application (Laravel 12 + PostgreSQL 16).

    Every response uses the envelope `{ success, message, data }`, plus
    `pagination` on list endpoints. User-facing messages are Arabic.
    Timestamps are ISO-8601 UTC (`2026-09-08T12:30:00Z`). Ids are returned as
    strings and accepted as strings or numbers.

    Roles: `0` user, `1` admin, `2` super admin. Authorisation is enforced by
    server-side middleware on every admin route.

    The prose reference is `docs/FINAL_API_CONTRACT.md`.

servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local (desktop, or a phone through `adb reverse`)
  - url: http://10.0.2.2:8000/api/v1
    description: Local, as seen from the Android emulator
  - url: http://192.168.1.10:8000/api/v1
    description: Local, as seen from a physical device on the same Wi-Fi

tags:
  - name: Health
  - name: Auth
  - name: Catalog
  - name: Products
  - name: Stores
  - name: Prices
  - name: Reports
  - name: Official prices
  - name: Notifications
  - name: Admin

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum access token, valid for 60 minutes.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    Search:
      name: search
      in: query
      schema: { type: string }
    LocationId:
      name: location_id
      in: query
      description: Restricts market aggregates to stores in this district.
      schema: { type: string }
    SectorId:
      name: sector_id
      in: query
      schema: { type: string }

  schemas:
    Envelope:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: تم جلب البيانات بنجاح }
        data: {}

    Pagination:
      type: object
      properties:
        current_page: { type: integer, example: 1 }
        last_page: { type: integer, example: 3 }
        per_page: { type: integer, example: 20 }
        total: { type: integer, example: 42 }

    Error:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: يرجى التحقق من البيانات المدخلة }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }

    User:
      type: object
      properties:
        id: { type: string, example: "7" }
        name: { type: string, example: مستخدم وفّر }
        phone_number: { type: string, example: "0990000001" }
        email: { type: string, nullable: true }
        role: { type: integer, enum: [0, 1, 2] }
        location_id: { type: string, nullable: true, example: "18" }
        location: { type: string, example: الكتلة الثانية - الجميلية }
        district: { type: string, nullable: true }
        sector_id: { type: string, nullable: true }
        sector: { type: string, nullable: true }
        is_active: { type: boolean }
        phone_verified_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        prices_count: { type: integer }
        ratings_count: { type: integer }
        reports_count: { type: integer }

    Product:
      type: object
      description: |
        official_price / real_price / avg_price / change_percent / is_price_up /
        prices_count are computed projections, not columns.
      properties:
        id: { type: string, example: "2" }
        name: { type: string, example: برغل }
        category: { type: string, example: حبوب ومطاحن }
        official_price: { type: number, example: 85 }
        real_price: { type: number, example: 92.65 }
        avg_price: { type: number, example: 93.16 }
        unit: { type: string, example: كيلوغرام }
        unit_id: { type: string, nullable: true }
        amount: { type: number, example: 1 }
        prices_count: { type: integer, example: 7 }
        change_percent: { type: number, example: 9 }
        is_price_up: { type: boolean }
        official_price_id: { type: string, nullable: true }

    Store:
      type: object
      properties:
        id: { type: string }
        location_id: { type: string }
        name: { type: string }
        address: { type: string }
        district: { type: string }
        area: { type: string, description: Display alias of district. }
        sector_id: { type: string, nullable: true }
        sector: { type: string }
        is_verified: { type: boolean }
        prices_count: { type: integer }
        submitted_by_user_id: { type: string, nullable: true }

    Price:
      type: object
      description: No `status` field exists; prices have no approval lifecycle.
      properties:
        id: { type: string }
        product_id: { type: string }
        product_name: { type: string }
        store_id: { type: string }
        store_name: { type: string }
        store_area: { type: string }
        location_id: { type: string, nullable: true }
        sector_id: { type: string, nullable: true }
        price: { type: number }
        unit: { type: string }
        unit_id: { type: string }
        amount: { type: number }
        brand: { type: string }
        brand_id: { type: string, nullable: true }
        user_id: { type: string }
        submitted_by: { type: string }
        submitted_at: { type: string, format: date-time }
        thumbs_up: { type: integer }
        thumbs_down: { type: integer }
        total_ratings: { type: integer }

    Report:
      type: object
      properties:
        id: { type: string }
        price_id: { type: string }
        type:
          type: string
          enum: [سعر مبالغ فيه, سعر غير صحيح, معلومات غير صحيحة]
        description:
          type: string
          nullable: true
          description: Only allowed with the "معلومات غير صحيحة" type, where it is required.
        user_id: { type: string }
        user_name: { type: string }
        product_id: { type: string, nullable: true }
        product_name: { type: string }
        store_id: { type: string, nullable: true }
        store_name: { type: string }
        store_area: { type: string }
        location_id: { type: string, nullable: true }
        sector_id: { type: string, nullable: true }
        price: { type: number, nullable: true }
        unit: { type: string, nullable: true }
        amount: { type: number, nullable: true }
        reported_at: { type: string, format: date-time }

    OfficialPrice:
      type: object
      properties:
        id: { type: string }
        product_id: { type: string }
        product_name: { type: string }
        category: { type: string }
        unit_id: { type: string }
        unit: { type: string }
        amount: { type: number }
        price: { type: number }
        created_at: { type: string, format: date-time }

    OfficialPriceHistoryEntry:
      type: object
      properties:
        id: { type: string }
        price: { type: number }
        amount: { type: number }
        unit: { type: string }
        changed_at: { type: string, format: date-time }

    Location:
      type: object
      properties:
        id: { type: string }
        sector_id: { type: string }
        sector: { type: string }
        district: { type: string, description: Canonical field name. }
        area: { type: string, description: UI alias, same value as district. }
        stores_count: { type: integer }

    Sector:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        locations_count: { type: integer }

    Unit:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        usage_count: { type: integer }

    Brand:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        products_count: { type: integer }
        usage_count: { type: integer }

    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string, example: official_price }
        title: { type: string }
        body: { type: string }
        product_id: { type: string, nullable: true }
        is_read: { type: boolean }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not allowed, or the account is blocked
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Still referenced, or a rule forbids the change
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Validation:
      description: Validation failed (or a wrong/expired OTP)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited, or the OTP resend cooldown is still running
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

paths:
  /health:
    get:
      tags: [Health]
      summary: Laravel and PostgreSQL connectivity
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: ok }
                          database_driver: { type: string, example: pgsql }
                          database: { type: string, example: up }
                          database_version: { type: string }
                          time: { type: string, format: date-time }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an unverified account and send an OTP
      description: Deliberately returns **no** tokens. Call `/auth/verify-otp` next.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone_number, password, password_confirmation]
              properties:
                name: { type: string, minLength: 2, maxLength: 255 }
                phone_number: { type: string, pattern: "^[0-9+]{9,15}$" }
                password: { type: string, minLength: 6 }
                password_confirmation: { type: string }
                location_id: { type: string, nullable: true }
      responses:
        "201":
          description: OTP sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          requires_verification: { type: boolean, example: true }
                          phone_number: { type: string }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify the phone number and receive the first session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, code]
              properties:
                phone_number: { type: string }
                code: { type: string, example: "123456" }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/TokenPair"
                          - type: object
                            properties:
                              user: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /auth/resend-otp:
    post:
      tags: [Auth]
      summary: Send a fresh verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number]
              properties:
                phone_number: { type: string }
      responses:
        "200": { description: Sent }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in (role 0)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, password]
              properties:
                phone_number: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/TokenPair"
                          - type: object
                            properties:
                              user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/admin/login:
    post:
      tags: [Auth]
      summary: Sign in to the admin panel (role 1 or 2 only)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, description: Phone number or email. }
                password: { type: string }
      responses:
        "200": { description: Signed in }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the token pair
      description: The presented refresh token is revoked immediately.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token and its refresh session
      responses:
        "200": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/me:
    get:
      tags: [Auth]
      summary: The signed-in user, with everything needed to restore a session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/profile:
    put:
      tags: [Auth]
      summary: Update the name and/or the account location
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                location_id: { type: string }
      responses:
        "200": { description: Updated }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send a password-reset OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number]
              properties:
                phone_number: { type: string }
      responses:
        "200": { description: Sent }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/reset-password:
    put:
      tags: [Auth]
      summary: Set a new password with an OTP and revoke every session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, code, new_password, new_password_confirmation]
              properties:
                phone_number: { type: string }
                code: { type: string }
                new_password: { type: string, minLength: 6 }
                new_password_confirmation: { type: string }
      responses:
        "200": { description: Changed }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /auth/change-password/request-otp:
    post:
      tags: [Auth]
      summary: Send a password-change OTP to the signed-in account
      responses:
        "200": { description: Sent }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/change-password:
    put:
      tags: [Auth]
      summary: Change the password from settings
      description: OTP is the primary flow; `current_password` is accepted for backward compatibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password, new_password_confirmation]
              properties:
                code: { type: string }
                current_password: { type: string }
                new_password: { type: string, minLength: 6 }
                new_password_confirmation: { type: string }
      responses:
        "200": { description: Changed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }

  /sectors:
    get:
      tags: [Catalog]
      summary: List sectors
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Sector" }
    post:
      tags: [Catalog, Admin]
      summary: Create a sector (role >= 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /sectors/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Catalog, Admin]
      summary: Update a sector (role >= 1)
      responses:
        "200": { description: Updated }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Catalog, Admin]
      summary: Delete a sector (role >= 1)
      responses:
        "200": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }

  /locations:
    get:
      tags: [Catalog]
      summary: List districts
      security: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SectorId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Location" }
    post:
      tags: [Catalog, Admin]
      summary: Create a district (role >= 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sector_id, district]
              properties:
                sector_id: { type: string }
                district: { type: string }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /locations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Catalog, Admin]
      summary: Update a district (role >= 1)
      responses:
        "200": { description: Updated }
    delete:
      tags: [Catalog, Admin]
      summary: Delete a district (role >= 1)
      responses:
        "200": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }

  /units:
    get:
      tags: [Catalog]
      summary: List units
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Unit" }
    post:
      tags: [Catalog, Admin]
      summary: Create a unit (role >= 1)
      responses:
        "201": { description: Created }

  /units/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Catalog, Admin]
      summary: Rename a unit (role >= 1)
      responses:
        "200": { description: Updated }
    delete:
      tags: [Catalog, Admin]
      summary: Delete a unit (role >= 1)
      responses:
        "200": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }

  /brands:
    get:
      tags: [Catalog]
      summary: List brands
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Brand" }
    post:
      tags: [Catalog, Admin]
      summary: Create a brand (role >= 1)
      responses:
        "201": { description: Created }

  /brands/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Catalog, Admin]
      summary: Rename a brand (role >= 1)
      responses:
        "200": { description: Updated }
    delete:
      tags: [Catalog, Admin]
      summary: Delete a brand (role >= 1)
      responses:
        "200": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }

  /products:
    get:
      tags: [Products]
      summary: List products with location-aware market figures
      security: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - { name: category, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Product" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      tags: [Products, Admin]
      summary: Create a product (role >= 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name: { type: string }
                category: { type: string }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }

  /products/categories:
    get:
      tags: [Products]
      summary: Distinct categories in use
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { type: string }

  /products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Products]
      summary: One product, optionally for one district
      security: []
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Products, Admin]
      summary: Update a product (role >= 1)
      responses:
        "200": { description: Updated }
    delete:
      tags: [Products, Admin]
      summary: Soft-delete a product, keeping its historic prices (role >= 1)
      responses:
        "200": { description: Deleted }

  /products/{id}/prices:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Products, Prices]
      summary: Market prices submitted for a product
      security: []
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Price" }

  /stores:
    get:
      tags: [Stores]
      summary: List stores
      security: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SectorId"
        - $ref: "#/components/parameters/LocationId"
        - { name: is_verified, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Store" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      tags: [Stores]
      summary: Suggest a store
      description: A store submitted by a role-0 user is always created unverified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location_id, name, address]
              properties:
                location_id: { type: string }
                name: { type: string }
                address: { type: string }
                is_verified: { type: boolean, description: Honoured only for role >= 1. }
      responses:
        "201": { description: Created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }

  /stores/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Stores]
      summary: One store
      security: []
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Stores, Admin]
      summary: Update a store (role >= 1)
      responses:
        "200": { description: Updated }
    delete:
      tags: [Stores, Admin]
      summary: Soft-delete a store, keeping its historic prices (role >= 1)
      responses:
        "200": { description: Deleted }

  /stores/{id}/verify:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Stores, Admin]
      summary: Verify or un-verify a store (role >= 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_verified]
              properties:
                is_verified: { type: boolean }
      responses:
        "200": { description: Updated }
        "403": { $ref: "#/components/responses/Forbidden" }

  /prices:
    get:
      tags: [Prices, Admin]
      summary: Administrative price review list (role >= 1)
      parameters:
        - $ref: "#/components/parameters/Search"
        - { name: user_id, in: query, schema: { type: string } }
        - { name: product_id, in: query, schema: { type: string } }
        - { name: store_id, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/SectorId"
        - $ref: "#/components/parameters/LocationId"
        - { name: brand_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Price" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Prices]
      summary: Submit a market price
      description: The author is always the signed-in user; `user_id` in the body is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, store_id, unit_id, amount, price]
              properties:
                product_id: { type: string }
                store_id: { type: string }
                unit_id: { type: string }
                brand_id: { type: string, nullable: true }
                amount: { type: number, exclusiveMinimum: true, minimum: 0 }
                price: { type: number, minimum: 0 }
      responses:
        "201": { description: Created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }

  /prices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Prices, Admin]
      summary: Delete a price - the administrative review action (role >= 1)
      description: Cascades to that price's ratings and reports.
      responses:
        "200": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }

  /prices/{id}/vote:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Prices]
      summary: Rate a price
      description: |
        One rating per user per price. The same value again is idempotent; a
        different value updates the existing rating. Rating your own price is
        rejected with 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_up]
              properties:
                is_up: { type: boolean }
      responses:
        "200": { description: Saved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /reports:
    get:
      tags: [Reports, Admin]
      summary: List reports (role >= 1)
      parameters:
        - $ref: "#/components/parameters/Search"
        - { name: user_id, in: query, schema: { type: string } }
        - { name: product_id, in: query, schema: { type: string } }
        - { name: store_id, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/SectorId"
        - $ref: "#/components/parameters/LocationId"
        - { name: type, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Report" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Reports]
      summary: Report a price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price_id, type]
              properties:
                price_id: { type: string }
                type:
                  type: string
                  enum: [سعر مبالغ فيه, سعر غير صحيح, معلومات غير صحيحة]
                description:
                  type: string
                  description: Required for "معلومات غير صحيحة", ignored otherwise.
      responses:
        "201": { description: Created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }

  /reports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Reports, Admin]
      summary: Delete a report (role >= 1)
      responses:
        "200": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }

  /official-prices:
    get:
      tags: [Official prices]
      summary: Current official prices
      security: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - { name: product_id, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/OfficialPrice" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      tags: [Official prices, Admin]
      summary: Publish an official price (role >= 1)
      description: Notifies every active verified role-0 user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, unit_id, amount, price]
              properties:
                product_id: { type: string }
                unit_id: { type: string }
                amount: { type: number }
                price: { type: number }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }

  /official-prices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Official prices, Admin]
      summary: Publish a new version (role >= 1)
      description: Inserts a new row; the previous value stays in the history.
      responses:
        "200": { description: New version created }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Official prices, Admin]
      summary: Delete one official-price version (role >= 1)
      responses:
        "200": { description: Deleted }

  /official-prices/{id}/history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Official prices]
      summary: Every version of this product/unit series, newest first
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/OfficialPriceHistoryEntry" }

  /notifications:
    get:
      tags: [Notifications]
      summary: In-app notifications
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Notification" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Unread notification count
      responses:
        "200": { description: OK }

  /notifications/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Notifications]
      summary: Mark one notification as read
      responses:
        "200": { description: Marked }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark every notification as read
      responses:
        "200": { description: Marked }

  /admin/users:
    get:
      tags: [Admin]
      summary: List users (role >= 1)
      parameters:
        - $ref: "#/components/parameters/Search"
        - { name: status, in: query, schema: { type: string, enum: [active, blocked] } }
        - $ref: "#/components/parameters/SectorId"
        - $ref: "#/components/parameters/LocationId"
        - { name: role, in: query, schema: { type: integer, enum: [0, 1, 2] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Create a user (creating role >= 1 requires a super admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone_number, password]
              properties:
                name: { type: string }
                phone_number: { type: string }
                email: { type: string, nullable: true }
                password: { type: string, minLength: 6 }
                location_id: { type: string, nullable: true }
                role: { type: integer, enum: [0, 1, 2] }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Admin]
      summary: Update a user (role >= 1; touching an admin requires a super admin)
      responses:
        "200": { description: Updated }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Admin]
      summary: Soft-delete a user, keeping their contributions
      responses:
        "200": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/users/{id}/block:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Admin]
      summary: Block a user and kill their sessions immediately
      responses:
        "200": { description: Blocked }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{id}/unblock:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Admin]
      summary: Unblock a user
      responses:
        "200": { description: Unblocked }

  /admin/users/{id}/role:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Admin]
      summary: Change a role - super admin only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: integer, enum: [0, 1, 2] }
      responses:
        "200": { description: Updated }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/dashboard-stats:
    get:
      tags: [Admin]
      summary: Real counts and 30-day growth (role >= 1)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          totalUsers: { type: integer }
                          totalProducts: { type: integer }
                          totalStores: { type: integer }
                          totalPrices: { type: integer }
                          totalReports: { type: integer }
                          usersGrowth: { type: number }
                          productsGrowth: { type: number }
                          storesGrowth: { type: number }
                          pricesGrowth: { type: number }
                          reportsGrowth: { type: number }
                          period_days: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/recent-activity:
    get:
      tags: [Admin]
      summary: Recent real events (role >= 1)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            type: { type: string, enum: [price, report, user, store, official] }
                            text: { type: string }
                            time: { type: string }
                            color: { type: string }
                            created_at: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
