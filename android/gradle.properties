# تفعيل دعم مكتبات AndroidX الأساسية
android.useAndroidX=true

# تخصيص ذاكرة ممتازة لسرعة البناء المستقرة
org.gradle.jvmargs=-Xmx3076m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError

# تفعيل البناء المتوازي والكاش لتسريع الوقت لأقصى درجة
org.gradle.parallel=true
org.gradle.caching=true

# ✅ البناء التراكمي لكوتلن معطَّل عمداً.
# مع إصدار Kotlin المستخدم هنا كان يفشل البناء بشكل متكرر بالخطأ:
#   Could not close incremental caches in ...\caches-jvm\jvm\kotlin
#   Storage for [...] is already registered
# وهو خلل معروف في Build Tools API عند إعادة استخدام Kotlin daemon مع بناء
# متوازٍ. تعطيل التراكمية يجعل البناء أبطأ قليلاً لكنه يعمل دائماً.
kotlin.incremental=false
kotlin.incremental.android=false

# ✅ كوتلن يُصرَّف داخل عملية Gradle نفسها، بلا daemon منفصل.
# على هذا الجهاز يفشل تشغيل Kotlin daemon فيظهر في كل بناء:
#   e: Failed connecting to the daemon in 4 retries
#   java.lang.RuntimeException: Failed connecting to the daemon in 4 retries
# البناء كان ينجح في النهاية (يتراجع تلقائياً للتصريف داخل العملية) لكن بعد
# أربع محاولات اتصال فاشلة لكل وحدة كوتلن، وهو سبب البطء الشديد في
# flutter build apk --release. تحديد الاستراتيجية صراحةً يتخطى المحاولات
# الفاشلة من الأساس.
kotlin.compiler.execution.strategy=in-process

# الإعدادات الافتراضية المضافة بواسطة فلاتر
android.builtInKotlin=false
android.newDsl=false